services:
  app:
    build: .
    command: streamlit run app.py --server.headless true --server.port 8501 --server.address 0.0.0.0
    environment:
      STREAMLIT_SERVER_HEADLESS: "true"
      STREAMLIT_SERVER_PORT: "8501"
      STREAMLIT_SERVER_ADDRESS: "0.0.0.0"
    ports:
      - "6261:8501"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8501/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  playwright:
    image: mcr.microsoft.com/playwright:v1.52.0-noble
    working_dir: /app
    volumes:
      - .:/app
    environment:
      BASE_URL: http://app:8501
    depends_on:
      app:
        condition: service_healthy
